<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- Seuls les scripts de l'app et de cdn.jsdelivr.net (scan, OCR, QR) peuvent s'exécuter : pas de code en ligne. -->
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' https://cdn.jsdelivr.net blob: 'unsafe-eval' 'wasm-unsafe-eval'; object-src 'none'; base-uri 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Grocery Opti</title>
  <meta name="description" content="Tes courses au coût total le plus bas : liste, meilleur magasin et itinéraire, avec les vrais prix Colruyt, Delhaize et Aldi.">
  <meta name="theme-color" content="#0b7a52">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <header class="top">
    <div class="top-in">
      <div class="brand"><img src="icon.svg" alt=""> Grocery Opti</div>
      <button class="loc" id="loc" data-tab="settings"></button>
    </div>
  </header>

  <main id="view" aria-live="polite"></main>
  <div class="cta-bar" id="cta"></div>
  <nav class="tabs" id="tabs" aria-label="Navigation"></nav>
  <div id="toast" role="status"></div>
  <script type="module" src="src/app.js"></script>
</body>
</html>

name: Relevé brut (recettes Wikibooks, Delhaize)
on:
  push:
    branches: [data-raw]
permissions:
  contents: write
jobs:
  raw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Catalogues complets (test)
        run: node prices/catalogs.mjs delhaize aldi
        continue-on-error: true
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Les gros fichiers (> 90 Mo) sont compressés.
          git add data-raw
          git commit -m "Relevé brut (catalogues)" || exit 0
          git pull --rebase -q origin data-raw || true
          git push

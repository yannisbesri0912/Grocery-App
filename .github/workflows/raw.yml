name: Relevé brut (recettes Wikibooks, Delhaize)
on:
  push:
    branches: [data-raw]
permissions:
  contents: write
jobs:
  raw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Photos des recettes (Wikimedia)
        run: node prices/recipe-images.mjs data-raw/recipe-images.json
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-raw
          git commit -m "Relevé brut (photos avec le Kookboek)" || exit 0
          git pull --rebase -q origin data-raw || true
          git push

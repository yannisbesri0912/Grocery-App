name: Prix réels

# Chaque nuit : vrais prix Colruyt (catalogue public), Delhaize et Aldi (robot
# navigateur), promotions PrijsProfeet. Puis l'app est redéployée.
on:
  schedule:
    - cron: '17 4 * * *'
    # Copie Colruyt du jour publiée vers midi : second passage léger, Colruyt seul.
    - cron: '41 15 * * *'
  workflow_dispatch:
    inputs:
      sources:
        description: 'Sources (vide = toutes) : colruyt delhaize aldi promos'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HAS_VPN: ${{ secrets.NORDVPN_USER != '' && secrets.NORDVPN_PASS != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium

      # Optionnel : passer par NordVPN (identifiants de service à mettre dans
      # Settings → Secrets → Actions : NORDVPN_USER et NORDVPN_PASS).
      - name: Connexion NordVPN (Belgique)
        if: env.HAS_VPN == 'true'
        env:
          NORDVPN_USER: ${{ secrets.NORDVPN_USER }}
          NORDVPN_PASS: ${{ secrets.NORDVPN_PASS }}
        run: |
          sudo apt-get install -y -qq openvpn > /dev/null
          HOST=$(curl -s 'https://api.nordvpn.com/v1/servers/recommendations?filters\[country_id\]=21&filters\[servers_technologies\]\[identifier\]=openvpn_udp&limit=1' | jq -r '.[0].hostname')
          echo "Serveur : $HOST"
          curl -s -o nord.ovpn "https://downloads.nordcdn.com/configs/files/ovpn_udp/servers/$HOST.udp.ovpn"
          printf '%s\n%s\n' "$NORDVPN_USER" "$NORDVPN_PASS" > auth.txt
          sudo openvpn --config nord.ovpn --auth-user-pass auth.txt --daemon --log vpn.log
          for i in $(seq 1 20); do sleep 2; ip a show tun0 > /dev/null 2>&1 && break; done
          rm auth.txt
          echo "Pays de sortie : $(curl -s https://ipinfo.io/country)"

      - name: Récupération des prix
        run: node prices/run.mjs ${{ github.event.schedule == '41 15 * * *' && 'colruyt' || github.event.inputs.sources }}
        env:
          PRIJSPROFEET_KEY: ${{ secrets.PRIJSPROFEET_KEY }}

      - name: Enregistrer les nouveaux prix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json data/prices-report.md data/catalog-*.json data/same.json data/history.json
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Prix du $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

  deploy:
    needs: prices
    uses: ./.github/workflows/pages.yml
